# ============================================================
# 智能教务排课系统 —— Docker Compose 一键部署（本地验证 / 生产单主机通用）
# ============================================================
# 服务拓扑：
#   ┌──────────────┐  :80/公网   ┌─────────────────────────┐
#   │   浏览器用户  │ ──────────► │ frontend（Nginx :80）    │
#   └──────────────┘             │   · 托管 Vue dist        │
#                                │   · /api → backend:8080  │
#                                └───────────┬─────────────┘
#                                            │ docker 内网 service 名
#                                            ▼
#                                ┌─────────────────────────┐
#                                │ backend（Spring Boot 8080）│
#                                │   · /api REST + @Async    │
#                                │   · JWT / 限流 / 验证码   │
#                                └───────────┬─────────────┘
#                                            │ JDBC
#                                            ▼
#                                ┌─────────────────────────┐
#                                │ mysql（MySQL 8.0 :3306） │
#                                │   · 持久化 volume        │
#                                │   · 第一次启动可选导入SQL │
#                                └─────────────────────────┘
# ============================================================
# 启动前必做：
#   ① 复制 .env.example 为 .env，填 DB_PWD / JWT_SECRET / EDU_SILICONFLOW_API_KEY
#   ② （强烈建议）把本地 edu_schedule_ai 数据库导出为 .sql，放到 ./docker/mysql-init/ 下
#      → 容器第一次启动会自动执行该目录下所有 .sql，直接得到和本地一致的数据
# 启动命令（项目根目录执行，即 docker-compose.yml 所在目录）：
#   docker compose up -d --build           构建 + 后台启动三容器
#   docker compose ps                      查看状态（三容器 healthy = 成功）
#   docker compose logs -f backend         看后端实时日志
#   docker compose down                    停止 + 删除容器（命名卷不会删，数据保留）
#   docker compose down -v                 停止 + 删除容器 + 删除所有卷（⚠️ 数据库数据清空）
# ============================================================

name: edu-schedule    # compose 项目名，所有容器/网络/卷都带这个前缀

services:

  # ============================================================
  # 1) MySQL 8.0 —— 数据库（持久化命名卷 edu_mysql_data）
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: edu-mysql
    restart: always
    environment:
      TZ: Asia/Shanghai
      # root 密码：来自 .env 的 DB_PWD（不要把密码写死在本文件！）
      MYSQL_ROOT_PASSWORD: ${DB_PWD}
      # 第一次启动自动创建的数据库名（与后端 edu.datasource 默认名一致）
      MYSQL_DATABASE: edu_schedule_ai
      # 字符集（通过 command 参数显式写也行，这里双保险）
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --skip-character-set-client-handshake
      --innodb-buffer-pool-size=512M
      --max-connections=200
      --wait-timeout=28800
      --slow-query-log=ON
      --long-query-time=2
    ports:
      # 宿主机 3307 → 容器 3306
      # ⚠️ 故意不用 3306：防止你本地已经装了 MySQL 占 3306 冲突
      # 用 Navicat / DBeaver 查看容器里的数据库时，连 localhost:3307，账号 root，密码 .env 里的 DB_PWD
      - "3307:3306"
    volumes:
      # ① DB 数据持久化：容器销毁后重建，数据还在
      - edu_mysql_data:/var/lib/mysql
      # ② 可选：第一次启动自动执行 SQL（放你本地 DB 导出的 .sql）
      #    把 edu_schedule_ai_20260819.sql 丢到 ./docker/mysql-init/，第一次启动会自动建表+导数据
      #    ⚠️ 注意：只在"卷是空的 / 第一次启动"时执行；如果卷里已有数据，加新 .sql 不会再跑
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 等 MySQL 真的 ready 再起 backend（不然 backend 启动时 DB 还没起来 → 启动失败）
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${DB_PWD} --silent || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s   # MySQL 第一次启动初始化数据目录要 20~30s
      retries: 6
    networks:
      - edu-network

  # ============================================================
  # 2) Backend —— Spring Boot 后端（prod 模式）
  # ============================================================
  backend:
    build:
      context: ./edu-schedule-ai          # Dockerfile 所在目录
      dockerfile: Dockerfile
    image: edu-schedule-ai:latest
    container_name: edu-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy        # 必须等 MySQL HEALTHCHECK OK 再启动
    environment:
      TZ: Asia/Shanghai
      # ---- 数据库连接（容器内网 mysql:3306）----
      DB_HOST: mysql                      # docker-compose service 名，内网 DNS 自动解析
      DB_PORT: "3306"
      DB_NAME: edu_schedule_ai
      DB_USER: root
      DB_PWD: ${DB_PWD}                   # 来自 .env，prod 强校验（无值启动失败）
      # ---- JWT ----
      JWT_SECRET: ${JWT_SECRET}           # 来自 .env，prod 强校验（无值启动失败）
      EDU_JWT_EXPIRE: "43200"             # 12h
      # ---- 注册安全 ----
      EDU_AUTH_REGISTRATION_ENABLED: "false"   # 生产默认关，只允许教务建账号
      # ---- AI ----
      EDU_SILICONFLOW_API_KEY: ${EDU_SILICONFLOW_API_KEY}   # 来自 .env
      # ---- Spring Profile ----
      SPRING_PROFILES_ACTIVE: prod
      # ---- CORS 白名单（前端经 Nginx 反代是同源，所以这里其实用不到；留空或放真实域名）----
      # 如果要直接连后端 8080 调 API，把下面注释打开改成真实来源
      # EDU_CORS_ALLOWED_ORIGINS_0: "https://edu.example.com"
      # EDU_CORS_ALLOWED_ORIGINS_1: "https://admin.example.com"
    ports:
      # 宿主机 8080 → 容器 8080
      # ⚠️ 真上生产：建议把这两行注释掉，公网只走 frontend 的 :80 / :443
      #    这里保留是为了本地调试时直接调 Swagger/接口方便
      - "8080:8080"
    volumes:
      # 后端日志持久化：容器重启后 /app/logs 不丢，便于排课问题审计
      - edu_backend_logs:/app/logs
    healthcheck:
      # Spring Boot 启动 5s 左右，但第一次连 MySQL 可能要等久点
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ || curl -fsS http://localhost:8080/api/ || exit 1"]
      interval: 20s
      timeout: 5s
      start_period: 90s     # backend 第一次启动有 Maven+Spring 初始化，给足 90s 启动宽限期
      retries: 5
    # ---- 资源限制（生产按需调大；单机 2C/4G 的机器可以给 2C/2G）----
    mem_limit: 2048m
    cpus: '2.0'
    networks:
      - edu-network

  # ============================================================
  # 3) Frontend —— Vue 前端（Nginx :80，含 /api 反代）
  # ============================================================
  frontend:
    build:
      context: ./edu-schedule-ai-web      # Dockerfile 所在目录
      dockerfile: Dockerfile
    image: edu-schedule-frontend:latest
    container_name: edu-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy        # 必须等 backend HEALTHCHECK OK 再起（防止打开页面空白）
    ports:
      # 宿主机 80 → Nginx 80
      # ⚠️ 如果宿主机 80 被 IIS/Apache/其他占用，改成 "8081:80" 即可
      - "80:80"
    volumes:
      # Nginx access/error 日志持久化
      - edu_frontend_logs:/var/log/nginx
      # ⚠️ 可选：线上要改 Nginx 配置时不重 build 镜像，把本地 nginx.conf 挂进去覆盖
      # - ./edu-schedule-ai-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - edu-network

# ============================================================
# 持久化命名卷（docker compose down -v 才会删）
# ============================================================
volumes:
  edu_mysql_data:
    name: edu_mysql_data
  edu_backend_logs:
    name: edu_backend_logs
  edu_frontend_logs:
    name: edu_frontend_logs

# ============================================================
# 内部网络（三容器互相访问；对外只暴露 mysql:3307 + backend:8080 + frontend:80）
# ============================================================
networks:
  edu-network:
    name: edu-network
    driver: bridge
