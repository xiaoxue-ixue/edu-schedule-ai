<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" width="720" height="580" aria-label="edu-schedule architecture">
  <defs>
    <style>
      :root { color-scheme: light dark }
      text { font-family: "Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif }
      .layer-tag { font-size:12px; font-weight:600; fill:#6b7280; letter-spacing:.04em }
      .box { stroke:#e5e7eb; fill:#f5f6f8; stroke-width:1 }
      .box-brand { stroke:#6d28d9; fill:#ede9fe; stroke-width:2 }
      .box-blue { stroke:#0ea5e9 }
      .box-green { stroke:#10b981 }
      .node-title { font-size:13px; font-weight:600; fill:#111827 }
      .node-sub { font-size:11px; fill:#6b7280 }
      .badge { font-size:10px; font-weight:600; fill:#fff }
      .conn { stroke:#c7cdd5; stroke-width:1.5; fill:none }
      .conn-brand { stroke:#6d28d9; stroke-width:2 }
      .conn-label { font-size:10px; fill:#6b7280 }
      .bar { fill:#6d28d9 }
      .bar-blue { fill:#0ea5e9 }
      .bar-green { fill:#10b981 }
      @media (prefers-color-scheme: dark) {
        .box { stroke:#2c3039; fill:#1f2229 }
        .box-brand { stroke:#6d28d9; fill:#3b0764 }
        .node-title { fill:#e5e7eb }
        .node-sub, .layer-tag, .conn-label { fill:#9ca3af }
        .conn { stroke:#3f444e }
      }
    </style>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-brand" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 层标签 -->
  <text class="layer-tag" x="24" y="44">① 客户端（三端 · 浏览器）</text>
  <text class="layer-tag" x="24" y="148">② 接入 / 反向代理</text>
  <text class="layer-tag" x="24" y="252">③ Spring Boot 后端（8080，三层 RBAC + 双线程池）</text>
  <text class="layer-tag" x="24" y="504">④ 持久化与外部服务</text>

  <!-- 客户端 Admin/Teacher/Student -->
  <rect class="box" x="40" y="60" width="190" height="70" rx="8"/>
  <rect class="bar"       x="40" y="60" width="8"  height="70" rx="8 0 0 8"/>
  <text class="node-title" x="62" y="88">教务管理端 Admin</text>
  <text class="node-sub"   x="62" y="108">基础数据 · 排课 · 冲突 · 权限</text>

  <rect class="box" x="265" y="60" width="190" height="70" rx="8"/>
  <rect class="bar-blue"  x="265" y="60" width="8"  height="70" rx="8 0 0 8"/>
  <text class="node-title" x="287" y="88">教师端 Teacher</text>
  <text class="node-sub"   x="287" y="108">课表 · 可排时间 · 评教 · 资料</text>

  <rect class="box" x="490" y="60" width="190" height="70" rx="8"/>
  <rect class="bar-green" x="490" y="60" width="8"  height="70" rx="8 0 0 8"/>
  <text class="node-title" x="512" y="88">学生端 Student</text>
  <text class="node-sub"   x="512" y="108">课表 · 公告 · 评教打分</text>

  <path class="conn" marker-end="url(#arr)" d="M 135 130 C 135 138  175 138  175 148"/>
  <path class="conn" marker-end="url(#arr)" d="M 360 130 C 360 138  360 138  360 148"/>
  <path class="conn" marker-end="url(#arr)" d="M 585 130 C 585 138  545 138  545 148"/>
  <text class="conn-label" x="70"  y="143">HTTPS</text>
  <text class="conn-label" x="525" y="143">HTTPS</text>

  <!-- 接入层 Nginx / Vite -->
  <rect class="box box-blue" x="60" y="164" width="240" height="64" rx="8"/>
  <text class="node-title" x="80" y="190">Nginx · 生产（80）</text>
  <text class="node-sub"   x="80" y="208">托管 dist · /api 反代 8080 · Gzip · 强缓存</text>

  <rect class="box box-blue" x="420" y="164" width="240" height="64" rx="8"/>
  <text class="node-title" x="440" y="190">Vite Dev Proxy · 本地（5173）</text>
  <text class="node-sub"   x="440" y="208">/api → http://localhost:8080 · HMR 热更新</text>

  <path class="conn" marker-end="url(#arr)" d="M 180 228 C 180 240  220 240  220 252"/>
  <path class="conn" marker-end="url(#arr)" d="M 540 228 C 540 240  500 240  500 252"/>

  <!-- 后端：安全层 -->
  <rect class="box box-blue" x="40" y="268" width="640" height="58" rx="8"/>
  <text class="node-title" x="58" y="292">🔐 接入安全层：JwtAuthInterceptor + Captcha + RateLimit + CORS 白名单</text>
  <text class="node-sub"   x="58" y="312">3 层 RBAC（admin /api/admin·*  |  teacher /api/teacher·*  |  student /api/student·*）</text>

  <!-- 业务层 基础 CRUD -->
  <rect class="box" x="40" y="340" width="300" height="100" rx="8"/>
  <text class="node-title" x="58" y="364">📚 基础数据 &amp; 通用 CRUD</text>
  <text class="node-sub"   x="58" y="382">学期/校区/班级/课程/教师/教室/时间段 (7 维)</text>
  <text class="node-sub"   x="58" y="400">用户管理 · 公告 · 教学评价打分 · AI 质量报告</text>
  <text class="node-sub"   x="58" y="418">冲突检测 REST API</text>

  <!-- 核心链路 排课（描边加粗） -->
  <rect class="box-brand" x="360" y="334" width="320" height="112" rx="10"/>
  <rect class="bar" x="360" y="334" width="96" height="20" rx="10 0 0 0"/>
  <text class="badge"      x="368" y="349">核心链路</text>
  <text class="node-title" x="378" y="370">🧠 智能排课（异步状态机）</text>
  <text class="node-sub"   x="378" y="390">ScheduleTaskController → PENDING→RUNNING</text>
  <text class="node-sub"   x="378" y="406">→ @Async scheduleExecutor(4-8-16) → 幂等校验</text>
  <text class="node-sub"   x="378" y="422">→ ScheduleAgentService（LLM + 工具集）→ 落表</text>

  <!-- AI 集成 + @Async 池 -->
  <rect class="box" x="40" y="476" width="300" height="52" rx="8"/>
  <text class="node-title" x="58" y="500">🤖 AI 集成（LLM + 代理探测 + 429 退避）</text>
  <text class="node-sub"   x="58" y="516">SpringAiModelFactory · SiliconFlow · 质量分析 Prompt</text>

  <rect class="box" x="360" y="476" width="320" height="52" rx="8"/>
  <text class="node-title" x="378" y="500">🧵 @Async 双线程池（AsyncConfig）</text>
  <text class="node-sub"   x="378" y="516">schedule 4/8/16 · sys 4/20/200 · CallerRunsPolicy 背压</text>

  <!-- 连接器 -->
  <path class="conn"       marker-end="url(#arr)"       d="M 190 326 C 190 334  190 334  190 340"/>
  <path class="conn-brand" marker-end="url(#arr-brand)" d="M 520 326 C 520 334  520 334  520 334"/>
  <path class="conn-brand" marker-end="url(#arr-brand)" d="M 400 446 C 400 450  220 450  220 476"/>
  <text class="conn-label" x="240" y="455">启发式打分 / Prompt 流</text>
  <path class="conn-brand" marker-end="url(#arr-brand)" d="M 520 446 C 520 450  520 450  520 476"/>

  <!-- 持久化 外部 -->
  <rect class="box box-green" x="40" y="534" width="200" height="32" rx="8"/>
  <text class="node-title" x="58" y="555">🗄️ MySQL 8 · 28 表 + 40 外键</text>

  <rect class="box box-green" x="260" y="534" width="200" height="32" rx="8"/>
  <text class="node-title" x="278" y="555">☕ Caffeine 本地缓存</text>

  <rect class="box" x="480" y="534" width="200" height="32" rx="8"/>
  <text class="node-title" x="498" y="555">🌐 SiliconFlow LLM API</text>

  <path class="conn" marker-end="url(#arr)" d="M 190 528 C 190 532  190 532  140 534"/>
  <path class="conn" marker-end="url(#arr)" d="M 250 528 C 250 532  310 532  310 534"/>
  <path class="conn" marker-end="url(#arr)" d="M 250 528 C 350 532  520 532  520 534"/>
  <text class="conn-label" x="380" y="530">REST · /v1/chat/completions</text>
</svg>
