# ============================================================
# 智能教务排课系统 —— 前端 Nginx 配置
# 作用：
#   ① 托管 Vue 静态文件（index.html + assets）
#   ② Vue Router history 模式（刷新浏览器不 404）
#   ③ /api 反向代理到后端容器（docker-compose 内网服务名 backend:8080）
#   ④ Gzip 压缩 JS/CSS 减少 60%+ 传输体积
#   ⑤ 50MB 文件上传支持（与 application.yml 的 multipart.max-file-size 对齐）
#   ⑥ 真实客户端 IP / Scheme 透传给后端（JWT / 限流 / 审计日志拿到真实 IP）
# ============================================================

server {
    listen       80;
    listen  [::]:80;
    server_name  _;   # 匹配所有主机名；上线后换成你的真实域名（edu.example.com）

    # 字符集
    charset utf-8;

    # ---------------- 日志 ----------------
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # ---------------- 上传大小 ----------------
    # ⚠️ 必须与后端 application.yml spring.servlet.multipart.max-file-size 保持一致（当前 50MB）
    #    Nginx 默认只有 1MB，超过直接返回 413 Request Entity Too Large，请求连后端都到不了
    client_max_body_size 50m;
    client_body_timeout 60s;

    # ---------------- Gzip 压缩 ----------------
    gzip                on;
    gzip_vary           on;
    gzip_proxied        any;
    gzip_comp_level     6;            # 1~9，6 是压缩率/CPU 平衡点
    gzip_min_length     1024;         # <= 1KB 的不压（压了反而变大）
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ---------------- Vue Router：history 模式 ----------------
    # 刷新 /students/schedule 这种 URL 时，Nginx 找不到对应文件会 404
    # try_files 让所有找不到的路径统一回退到 /index.html，由 Vue Router 前端接管路由
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ---------------- 静态资源强缓存（Vue Vite 文件名带 hash） ----------------
    # Vite 生产打包时 JS/CSS/图片 文件名都带 hash（如 index-BN-ruIOd.js）
    # 内容变 → hash 变 → URL 变，所以可以强缓存 1 年，用户第二次打开直接读本地缓存秒开
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;   # 静态文件请求不打 access.log，减少磁盘 IO
    }

    # ---------------- /api 反向代理到后端 ----------------
    # 前端 axios baseURL 设为 /api（同源），Nginx 把 /api/xxx 转给 docker 内部 backend 服务
    # 好处：① 前端不用操心跨域（同源策略） ② 不用把后端 8080 暴露公网 ③ HTTPS 只在 Nginx 层终止
    location /api/ {
        # docker-compose 里后端服务名叫 backend，容器间 DNS 自动解析
        proxy_pass         http://backend:8080/api/;

        # ---- 真实 IP 透传 ----
        # 后端 JwtAuthInterceptor / RateLimitService 要拿真实客户端 IP 做限流和审计
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;

        # ---- 超时 ----
        # 排课 Agent 是重型任务，HTTP 提交 @Async 后立即返回（< 1s），所以 30s 足够
        # 如果以后加了同步等待型接口（比如 AI 生成报告），再相应调大
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    180s;   # 后端 Hikari connection-timeout 是 10s，但大任务整体等长点
        proxy_buffering       off;     # SSE/WebSocket 类接口以后扩展方便；普通 REST 关了也不影响
    }

    # ---------------- 健康检查端点（Nginx 自身健康检查，容器 HEALTHCHECK 调 /）----------------
    # 上面 location / 已经覆盖，这里不用额外写。
}
